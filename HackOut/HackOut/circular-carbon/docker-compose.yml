version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: circular-carbon-db
    environment:
      POSTGRES_DB: circular_carbon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d circular_carbon"]
      interval: 5s
      timeout: 5s
      retries: 5

  rag-service:
    build:
      context: ./rag-service
    container_name: circular-carbon-rag
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/circular_carbon
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: circular-carbon-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/circular_carbon
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RAG_SERVICE_URL: http://rag-service:8000/api/recommend
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-"http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost:8081,http://frontend:80"}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: circular-carbon-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
